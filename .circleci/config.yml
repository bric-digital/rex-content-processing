version: 2.1
orbs:
  node: circleci/node@7.2.1

jobs:
  build: # this can be any name you choose
    docker:
      - image: cimg/node:24.11.0-browsers
    executor: node/default # use the default executor defined within the orb
    steps:
      - checkout
      - run:
          name: Install Xvfb and Playwright System Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
            npx playwright install-deps chromium
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build code
          command: npm run build
      - run:
          name: Lint code
          command: npm run lint
      # - run:
      #     name: Test code
      #     command: xvfb-run --server-args="-screen 0 1280x1024x24" npm run test:ci
      - run:
          name: Run Extension Tests
          command: |
            # Clear old lock files left behind by the CircleCI environment spin-up
            sudo rm -f /tmp/.X99-lock /tmp/.X11-unix/X99
            
            # Execute with auto-allocated server numbers and verbose error piping
            xvfb-run \
              --auto-servernum \
              --server-num=1 \
              --server-args="-screen 1 1280x1024x24 -ac +extension GLX +render -noreset" \
              -e /dev/stdout \
              npx playwright test
      - store_artifacts:
          path: test-results
          destination: test-results